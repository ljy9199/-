<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
		<title>帖子编辑楼</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
				font-family: "PingFang SC", sans-serif;
			}

			body {
				background: #f5f7fa;
				padding: 15px;
			}

			/* 初始化全屏弹窗 —— 全新美观框架 */
			.init-mask {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background: rgba(0, 0, 0, 0.65);
				display: flex;
				align-items: center;
				justify-content: center;
				z-index: 999999;
				transition: opacity 0.3s ease;
			}

			.init-box {
				width: 88%;
				max-width: 380px;
				background: #fff;
				border-radius: 22px;
				padding: 38px 28px;
				text-align: center;
				box-shadow: 0 10px 30px rgba(0,0,0,0.2);
				position: relative;
				animation: popIn 0.3s ease forwards;
			}

			@keyframes popIn {
				from { transform: scale(0.9); opacity: 0; }
				to { transform: scale(1); opacity: 1; }
			}

			.init-title {
				font-size: 20px;
				font-weight: bold;
				color: #222;
				margin-bottom: 18px;
			}

			.init-text {
				font-size: 15px;
				color: #666;
				line-height: 1.7;
				margin-bottom: 32px;
				white-space: pre-line;
			}

			.init-btn {
			    width: 100%;
			    padding: 14px;
			    background: #666;     /* 原来的灰色 */
			    color: #fff;
			    border: none;
			    border-radius: 14px;
			    font-size: 16px;
			    font-weight: bold;
			    cursor: pointer;
			    transition: background 0.2s;
			}
			
			.init-btn:active {
			    background: #555;     /* 点击时的灰色 */
			}
			
			/* 默认隐藏编辑区 + 预览区 */
			.main-content {
				opacity: 0;
				transform: translateY(20px);
				transition: all 0.4s ease-out;
				pointer-events: none;
			}

			/* 点击确认后显示 */
			.main-content.show {
				opacity: 1;
				transform: translateY(0);
				pointer-events: auto;
			}

			.hide {
				display: none !important;
			}

			.hint {
				text-align: center;
				font-size: 12px;
				color: #999;
				margin-bottom: 10px;
			}
			.author-tip{
				text-align:center;
				font-size:11px;
				color:#bbbbbb;
				margin:5px 0 15px;
			}

			.editor-wrap {
				width: 100%;
				overflow: hidden;
				border-radius: 12px;
				background: #fff;
				margin-bottom: 20px;
				box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
			}

			.editor-slider {
				display: flex;
				transition: transform 0.3s ease;
			}

			.editor-page {
				width: 100%;
				flex-shrink: 0;
				padding: 15px;
			}

			.editor-page h3 {
				text-align: center;
				margin-bottom: 15px;
				font-size: 16px;
				color: #333;
			}

			.item {
				margin-bottom: 10px;
			}

			.item label {
				display: block;
				font-size: 13px;
				color: #666;
				margin-bottom: 4px;
			}

			.item input,
			.item textarea {
				width: 100%;
				padding: 8px 10px;
				border: 1px solid #ddd;
				border-radius: 8px;
				font-size: 14px;
				outline: none;
			}

			.item textarea {
				resize: none;
				overflow: hidden;
				min-height: 40px;
				height: auto;
				white-space: pre-wrap;
				word-wrap: break-word;
			}

			.item input:focus,
			.item textarea:focus {
				border-color: #0088ff;
			}

			.item .upload-box {
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 8px 10px;
				border: 1px solid #ddd;
				border-radius: 8px;
			}

			.avatar-upload {
				display: flex;
				align-items: center;
				gap: 10px;
			}

			.file-input {
				display: none;
			}

			.upload-btn {
				background: #999;
				color: #fff;
				padding: 6px 12px;
				border-radius: 8px;
				font-size: 14px;
				cursor: pointer;
				border: none;
			}

			.preview-small {
				width: 40px;
				height: 40px;
				border-radius: 50%;
				background: #eee;
				object-fit: cover;
			}

			.img-preview-small {
				width: 40px;
				height: 40px;
				border-radius: 8px;
				background: #eee;
				object-fit: cover;
			}

			.page-indicator {
				display: flex;
				justify-content: center;
				gap: 4px;
				margin-top: 15px;
			}

			.page-indicator .bar {
				flex: 1;
				height: 5px;
				border-radius: 3px;
				border: 1px solid #ccc;
				background: transparent;
			}

			.page-indicator .bar.active {
				background: #ccc;
			}

			.community-page {
				width: 100%;
				background: #f5f7fa;
			}

			.post-card {
				background: #fff;
				border-radius: 20px;
				padding: 20px;
				margin-bottom: 20px;
			}

			.post-header {
				display: flex;
				align-items: center;
				margin-bottom: 15px;
			}

			.avatar {
				width: 50px;
				height: 50px;
				border-radius: 50%;
				background: #eee;
				object-fit: cover;
			}

			.post-info {
				margin-left: 12px;
			}

			.nickname-row {
				display: flex;
				align-items: end;
				gap: 6px;
			}

			.nickname {
				font-size: 16px;
				font-weight: bold;
				color: #333;
			}

			.status {
				font-size: 12px;
				color: #999;
			}

			.time {
				font-size: 12px;
				color: #999;
				margin-top: 4px;
			}

			.post-title {
				font-size: 18px;
				font-weight: bold;
				margin-bottom: 10px;
				color: #222;
			}

			.post-content {
				font-size: 15px;
				color: #444;
				line-height: 1.5;
				margin-bottom: 15px;
			}

			.post-img-list {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
				margin-bottom: 10px;
			}

			.post-img {
				max-width: 100px;
				border-radius: 8px;
			}

			.post-stat {
				font-size: 12px;
				color: #999;
				display: flex;
				justify-content: space-between;
			}

			.reply-title {
				font-size: 16px;
				font-weight: bold;
				margin: 0 0 10px 5px;
				color: #333;
			}

			.reply-item {
				display: flex;
				background: #fff;
				border-radius: 16px;
				padding: 16px;
				margin-bottom: 10px;
			}

			.reply-right {
				flex: 1;
				margin-left: 12px;
			}

			.reply-header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 8px;
			}

			.floor {
				font-size: 12px;
				color: #999;
			}

			.reply-content {
				font-size: 14px;
				color: #444;
				line-height: 1.5;
				margin-bottom: 10px;
			}

			.reply-footer {
				font-size: 12px;
				color: #999;
				display: flex;
				justify-content: space-between;
			}

			.reply-img-list {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
				margin-bottom: 10px;
			}

			.reply-img {
				max-width: 100px;
				border-radius: 8px;
			}
		</style>
	</head>

		<script>
			// 初始化弹窗逻辑
			const initMask = document.getElementById('initMask');
			const enterBtn = document.getElementById('enterBtn');
			const mainContent = document.getElementById('mainContent');
			const bgMusic = document.getElementById('bgMusic');

			enterBtn.addEventListener('click', () => {
				initMask.classList.add('hide');
				mainContent.classList.add('show');
				bgMusic.play().catch(()=>{});
			});

			// 滑动切换
			const slider = document.getElementById('editorSlider');
			const editorWrap = document.getElementById('editorWrap');
			let startX = 0, moving = false, current = 0;
			editorWrap.addEventListener('touchstart', e => {
				startX = e.touches[0].clientX
			});
			editorWrap.addEventListener('touchmove', e => {
				moving = true;
				const dx = e.touches[0].clientX - startX;
				slider.style.transform = `translateX(${-current*100+dx/window.innerWidth*100}%)`;
			});
			editorWrap.addEventListener('touchend', e => {
				if (!moving) return;
				moving = false;
				const dx = e.changedTouches[0].clientX - startX;
				if (dx < -50 && current < 3) current++;
				if (dx > 50 && current > 0) current--;
				slider.style.transform = `translateX(${-current*100}%)`;
				updateBar();
			});

			function updateBar() {
				document.querySelectorAll('.page-indicator .bar').forEach((b, i) => b.classList.toggle('active', i === current));
			}

			// 头像预览
			function previewAvatar(input, smallId, bigId) {
				if (input.files && input.files[0]) {
					const reader = new FileReader();
					reader.onload = function(e) {
						document.getElementById(smallId).src = e.target.result;
						document.getElementById(bigId).src = e.target.result;
					}
					reader.readAsDataURL(input.files[0]);
				}
			}

			// 表情包预览
			function previewImg(input, smallId, bigId) {
				if (input.files && input.files[0]) {
					const reader = new FileReader();
					reader.onload = function(e) {
						document.getElementById(smallId).src = e.target.result;
						document.getElementById(bigId).src = e.target.result;
					}
					reader.readAsDataURL(input.files[0]);
				}
			}

			// 同步数据
			function updateAll() {
				document.getElementById('prev_name').innerText = document.getElementById('p_name').value;
				document.getElementById('prev_status').innerText = document.getElementById('p_status').value;
				document.getElementById('prev_time').innerText = document.getElementById('p_time').value;
				document.getElementById('prev_title').innerText = document.getElementById('p_title').value;
				document.getElementById('prev_content').innerText = document.getElementById('p_content').value;
				document.getElementById('prev_view').innerText = '浏览 ' + document.getElementById('p_view').value;
				document.getElementById('prev_like').innerText = '点赞 ' + document.getElementById('p_like').value;
				document.getElementById('prev_reply').innerText = '回复 ' + document.getElementById('p_reply').value;

				document.getElementById('prev_r1_name').innerText = document.getElementById('r1_name').value;
				document.getElementById('prev_r1_status').innerText = document.getElementById('r1_status').value;
				document.getElementById('prev_r1_time').innerText = document.getElementById('r1_time').value;
				document.getElementById('prev_r1_content').innerText = document.getElementById('r1_content').value;
				document.getElementById('prev_r1_like').innerText = '点赞 ' + document.getElementById('r1_like').value;

				document.getElementById('prev_r2_name').innerText = document.getElementById('r2_name').value;
				document.getElementById('prev_r2_status').innerText = document.getElementById('r2_status').value;
				document.getElementById('prev_r2_time').innerText = document.getElementById('r2_time').value;
				document.getElementById('prev_r2_content').innerText = document.getElementById('r2_content').value;
				document.getElementById('prev_r2_like').innerText = '点赞 ' + document.getElementById('r2_like').value;

				document.getElementById('prev_r3_name').innerText = document.getElementById('r3_name').value;
				document.getElementById('prev_r3_status').innerText = document.getElementById('r3_status').value;
				document.getElementById('prev_r3_time').innerText = document.getElementById('r3_time').value;
				document.getElementById('prev_r3_content').innerText = document.getElementById('r3_content').value;
				document.getElementById('prev_r3_like').innerText = '点赞 ' + document.getElementById('r3_like').value;
			}

			document.querySelectorAll('input:not(.file-input),textarea').forEach(i => i.addEventListener('input', updateAll));
			updateAll();
		</script>
	</body>
</html>
